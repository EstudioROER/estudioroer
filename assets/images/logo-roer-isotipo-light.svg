<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Bloque Sólido Superior en Terracota -->
  <rect x="220" y="110" width="170" height="170" rx="14" fill="#DF603A" />
  
  <!-- Escuadra Exterior Principal a 90° -->
  <path d="M 110,390 L 110,110 L 180,110" 
        fill="none" stroke="#111418" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Líneas Técnicas Horizontales de Proyección -->
  <line x1="110" y1="280" x2="390" y2="280" stroke="#111418" stroke-width="28" stroke-linecap="round" />
  <line x1="110" y1="390" x2="280" y2="390" stroke="#111418" stroke-width="28" stroke-linecap="round" />
  
  <!-- Escuadra de Anclaje Inferior -->
  <polyline points="330,340 390,340 390,390" 
            fill="none" stroke="#DF603A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
</svg>